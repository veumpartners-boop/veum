<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="images/diff-icon-wheels.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비움박스 관리자</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg: #FFFFFF;
    --bg-raised: #F5F3EE;
    --bg-card: #F5F3EE;
    --ink: #1A1A1A;
    --ink-soft: #2D2D2D;
    --amber: #FFC700;
    --amber-deep: #E6B400;
    --text: #1C1B18;
    --text-dim: #5C584E;
    --border: #E1DCD1;
    --radius: 14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:var(--bg-raised);}
  body{
    font-family:'Pretendard', -apple-system, sans-serif;
    background:var(--bg-raised);
    color:var(--text);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    word-break:keep-all;
  }
  a{color:inherit;text-decoration:none;}

  .page-frame{max-width:900px;margin:0 auto;padding:0 24px;}
  .card{
    background:#fff;min-height:100vh;
    box-shadow:0 0 60px rgba(20,20,20,0.10);
    padding:0 0 60px;
  }

  header{border-bottom:1px solid var(--border);padding:20px 24px;}
  header h1{font-size:17px;font-weight:800;color:var(--ink);}

  /* Login */
  .login-wrap{max-width:340px;margin:80px auto;padding:0 24px;text-align:center;}
  .login-wrap h2{font-size:20px;font-weight:800;margin-bottom:8px;color:var(--ink);}
  .login-wrap p{font-size:13.5px;color:var(--text-dim);margin-bottom:24px;}
  .login-wrap input{
    width:100%;height:50px;border:1.5px solid var(--border);border-radius:10px;
    padding:0 16px;font-size:15px;font-family:inherit;outline:none;margin-bottom:12px;
    text-align:center;
  }
  .login-wrap input:focus{border-color:var(--ink);}
  .login-wrap button{
    width:100%;height:50px;background:var(--ink);color:var(--amber);border:none;
    border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;
    transition:background 0.15s;
  }
  .login-wrap button:hover{background:var(--ink-soft);}
  .login-error{color:#D8483F;font-size:13px;margin-top:10px;display:none;}

  /* Dashboard */
  #dashboard{display:none;padding:24px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .tab-btn{
    background:#fff;border:1.5px solid var(--border);color:var(--text-dim);
    padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:all 0.15s;
  }
  .tab-btn.active{background:var(--ink);color:var(--amber);border-color:var(--ink);}
  .tab-badge{
    display:inline-block;min-width:18px;height:18px;border-radius:999px;
    background:#D8483F;color:#fff;font-size:11px;font-weight:800;
    line-height:18px;text-align:center;padding:0 5px;margin-left:6px;
  }
  .tab-btn.active .tab-badge{background:var(--amber);color:var(--ink);}
  .tab-badge.zero{display:none;}
  .refresh-btn{
    background:transparent;border:1.5px solid var(--border);color:var(--text-dim);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  .refresh-btn:hover{border-color:var(--ink);color:var(--ink);}

  .order-card{
    background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);
    padding:20px;margin-bottom:14px;
  }
  .order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
  .type-badge{
    display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;
  }
  .type-badge.apply{background:rgba(255,199,0,0.18);color:var(--amber-deep);}
  .type-badge.collect{background:rgba(216,72,63,0.12);color:#D8483F;}
  .type-badge.add{background:rgba(30,120,90,0.12);color:#1E785A;}
  .order-time{font-size:12px;color:var(--text-dim);}
  .order-name{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:2px;}
  .order-detail{font-size:13.5px;color:var(--text-dim);line-height:1.7;margin-bottom:14px;}
  .order-detail b{color:var(--ink);}
  .order-controls{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    border-top:1px solid var(--border);padding-top:14px;
  }
  .order-controls select{
    height:40px;border:1.5px solid var(--border);border-radius:8px;
    padding:0 12px;font-size:13.5px;font-family:inherit;color:var(--text);
    background:#fff;
  }
  .pay-check{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-dim);}
  .pay-check input{width:16px;height:16px;accent-color:var(--ink);}
  .save-btn{
    background:var(--ink);color:var(--amber);border:none;
    padding:9px 18px;border-radius:8px;font-size:13.5px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:background 0.15s;
    margin-left:auto;
  }
  .save-btn:hover{background:var(--ink-soft);}
  .save-btn.saved{background:#1E785A;color:#fff;}
  .delete-req-btn{
    background:transparent;color:var(--text-dim);border:1.5px solid var(--border);
    padding:9px 14px;border-radius:8px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  .delete-req-btn:hover{border-color:#D8483F;color:#D8483F;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);font-size:14px;}

  .receipt-notice{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:rgba(255,199,0,0.14);border:1px solid rgba(255,199,0,0.4);
    border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;
  }
  .receipt-notice.issued{background:rgba(30,120,90,0.1);border-color:rgba(30,120,90,0.3);}
  .receipt-notice-text b{color:var(--ink);}
  .receipt-issue-btn{
    background:var(--ink);color:var(--amber);border:none;
    padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:700;
    cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .receipt-issued-tag{font-size:12.5px;font-weight:700;color:#1E785A;}

  .notify-overlay{
    display:none;position:fixed;inset:0;background:rgba(20,20,20,0.6);
    z-index:200;align-items:center;justify-content:center;padding:20px;
  }
  .notify-overlay.open{display:flex;}
  .notify-box{
    background:#fff;border-radius:16px;max-width:420px;width:100%;
    padding:28px;box-shadow:0 20px 60px rgba(0,0,0,0.3);
  }
  .notify-box .icon{
    width:48px;height:48px;border-radius:50%;background:#1E785A;color:#fff;
    font-size:24px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;
  }
  .notify-box h3{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:6px;}
  .notify-box p{font-size:13.5px;color:var(--text-dim);margin-bottom:16px;}
  .notify-box textarea{
    width:100%;min-height:110px;border:1.5px solid var(--border);border-radius:10px;
    padding:12px;font-size:13px;font-family:inherit;color:var(--text);resize:vertical;
    margin-bottom:12px;
  }
  .notify-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .notify-actions a, .notify-actions button{
    flex:1;text-align:center;border-radius:8px;padding:11px;font-size:13.5px;font-weight:700;
    border:none;cursor:pointer;font-family:inherit;
  }
  .notify-copy{background:var(--bg-card);color:var(--ink);border:1.5px solid var(--border) !important;}
  .notify-call{background:var(--ink);color:var(--amber);}
  .notify-close{background:transparent;color:var(--text-dim);width:100%;margin-top:10px;padding:8px;}
</style>
</head>
<body>

<div class="page-frame">
<div class="card">

<header><h1>🔒 비움박스 관리자</h1></header>

<div class="login-wrap" id="loginScreen">
  <h2>관리자 로그인</h2>
  <p>비밀번호를 입력해주세요.</p>
  <input type="password" id="passwordInput" placeholder="비밀번호">
  <button id="loginBtn" type="button">로그인</button>
  <p class="login-error" id="loginError">비밀번호가 올바르지 않아요.</p>
</div>

<div id="dashboard">
  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-type="all">전체<span class="tab-badge zero" id="badge-all">0</span></button>
      <button class="tab-btn" data-type="apply">신청<span class="tab-badge zero" id="badge-apply">0</span></button>
      <button class="tab-btn" data-type="collect">수거<span class="tab-badge zero" id="badge-collect">0</span></button>
      <button class="tab-btn" data-type="add">추가<span class="tab-badge zero" id="badge-add">0</span></button>
      <button class="tab-btn" data-type="business">🏢 업체승인<span class="tab-badge zero" id="badge-business">0</span></button>
    </div>
    <button class="refresh-btn" id="refreshBtn" type="button">↻ 새로고침</button>
  </div>
  <div class="tabs" id="bizSubTabs" style="display:none;margin-bottom:14px;">
    <button class="tab-btn active" data-bizstatus="all">전체</button>
    <button class="tab-btn" data-bizstatus="pending">대기중</button>
    <button class="tab-btn" data-bizstatus="approved">승인됨</button>
    <button class="tab-btn" data-bizstatus="rejected">거절됨</button>
  </div>
  <div id="orderList"></div>
</div>

</div>
</div>

<div class="notify-overlay" id="notifyOverlay">
  <div class="notify-box">
    <div class="icon">✓</div>
    <h3 id="notifyTitle">승인 완료!</h3>
    <p id="notifySub">이 업체에 아직 연락 안 하셨다면, 지금 알려주세요.</p>
    <textarea id="notifyMessage" readonly></textarea>
    <div class="notify-actions">
      <button class="notify-copy" type="button" id="notifyCopyBtn">문구 복사하기</button>
      <a href="#" class="notify-call" id="notifyCallLink">📞 전화 걸기</a>
    </div>
    <button class="notify-close" type="button" id="notifyCloseBtn">닫기</button>
  </div>
</div>

<script>
  // TODO: 실제 배포 시 비움앤타일 Supabase 프로젝트 값으로 교체하세요.
  const SUPABASE_URL = 'https://ujvatbawuqqdptpbqlxw.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_-QqPet3W0cTHvTs3VVElQQ_nU37kDEq';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let adminPassword = '';
  let allOrders = [];
  let allBusinessApps = [];
  let currentFilter = 'all';
  let bizStatusFilter = 'all';

  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const orderList = document.getElementById('orderList');
  const refreshBtn = document.getElementById('refreshBtn');

  const TYPE_LABEL = { apply: '신청', collect: '수거', add: '추가' };
  const STATUS_OPTIONS = {
    apply: [['new','접수'],['checked','확인완료'],['in_progress','배치준비중'],['done','배치완료']],
    add:   [['new','접수'],['checked','확인완료'],['in_progress','배치준비중'],['done','배치완료']],
    collect: [['new','접수'],['checked','확인완료'],['in_progress','수거예정'],['done','수거완료']],
  };

  function formatDate(dateStr){
    if(!dateStr) return '-';
    const d = new Date(dateStr);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function updateTabBadges(){
    const counts = { all: 0, apply: 0, collect: 0, add: 0 };
    allOrders.forEach(function(o){
      if(o.status === 'new'){
        counts.all++;
        if(counts[o.request_type] !== undefined) counts[o.request_type]++;
      }
    });
    const bizPendingCount = allBusinessApps.filter(function(b){ return b.status === 'pending'; }).length;

    ['all','apply','collect','add'].forEach(function(key){
      const el = document.getElementById('badge-' + key);
      el.textContent = counts[key];
      el.classList.toggle('zero', counts[key] === 0);
    });
    const bizEl = document.getElementById('badge-business');
    bizEl.textContent = bizPendingCount;
    bizEl.classList.toggle('zero', bizPendingCount === 0);
  }

  async function login(){
    const pw = passwordInput.value.trim();
    if(!pw) return;
    loginBtn.disabled = true;
    loginBtn.textContent = '확인 중...';
    try{
      const { data, error } = await supabaseClient.rpc('admin_list_requests', { p_password: pw });
      if(error) throw error;
      adminPassword = pw;
      allOrders = data || [];
      try{
        const { data: bizData } = await supabaseClient.rpc('admin_list_business_applications', { p_password: pw });
        allBusinessApps = bizData || [];
      } catch(e){ allBusinessApps = []; }
      loginScreen.style.display = 'none';
      dashboard.style.display = 'block';
      renderOrders();
      updateTabBadges();
    } catch(err){
      loginError.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.textContent = '로그인';
    }
  }

  loginBtn.addEventListener('click', login);
  passwordInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') login(); });

  async function refreshOrders(){
    try{
      const { data, error } = await supabaseClient.rpc('admin_list_requests', { p_password: adminPassword });
      if(error) throw error;
      allOrders = data || [];
      const { data: bizData } = await supabaseClient.rpc('admin_list_business_applications', { p_password: adminPassword });
      allBusinessApps = bizData || [];
      renderCurrentView();
      updateTabBadges();
    } catch(err){
      alert('목록을 불러오는 중 문제가 발생했어요.');
    }
  }
  refreshBtn.addEventListener('click', refreshOrders);

  document.getElementById('tabs').addEventListener('click', function(e){
    if(!e.target.classList.contains('tab-btn')) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.type;
    renderCurrentView();
  });

  const bizSubTabs = document.getElementById('bizSubTabs');

  function renderCurrentView(){
    bizSubTabs.style.display = currentFilter === 'business' ? 'flex' : 'none';
    if(currentFilter === 'business'){
      renderBusinessApps();
    } else {
      renderOrders();
    }
  }

  bizSubTabs.addEventListener('click', function(e){
    if(!e.target.classList.contains('tab-btn')) return;
    bizSubTabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    bizStatusFilter = e.target.dataset.bizstatus;
    renderBusinessApps();
  });

  function renderBusinessApps(){
    const filtered = bizStatusFilter === 'all'
      ? allBusinessApps
      : allBusinessApps.filter(b => b.status === bizStatusFilter);

    if(filtered.length === 0){
      orderList.innerHTML = '<div class="empty-state">해당하는 업체 가입 신청이 없어요.</div>';
      return;
    }
    orderList.innerHTML = filtered.map(function(b){
      const statusLabel = { pending: '대기중', approved: '승인됨', rejected: '거절됨' }[b.status] || b.status;
      const statusColor = b.status === 'approved' ? '#1E785A' : (b.status === 'rejected' ? '#D8483F' : 'var(--amber-deep)');
      return `
        <div class="order-card" data-id="${b.id}">
          <div class="order-top">
            <span class="type-badge" style="background:rgba(30,120,90,0.12);color:${statusColor};">${statusLabel}</span>
            <span class="order-time">${formatDate(b.created_at)}</span>
          </div>
          <div class="order-name">${b.business_name} · ${b.phone}</div>
          <div class="order-detail">
            <b>사업자등록번호</b> ${b.business_reg_no}<br>
            ${b.contact_name ? `<b>담당자</b> ${b.contact_name}<br>` : ''}
            ${b.doc_url ? `<a href="${b.doc_url}" target="_blank" style="color:var(--ink);text-decoration:underline;font-weight:700;">사업자등록증 사진 보기 →</a> &middot; <a href="${b.doc_url}" download style="color:var(--ink);text-decoration:underline;font-weight:700;">다운로드</a>` : '사업자등록증 없음'}
          </div>
          <div class="order-controls">
            <button class="save-btn biz-approve-btn" type="button" style="background:#1E785A;">승인</button>
            <button class="save-btn biz-reject-btn" type="button" style="background:#D8483F;margin-left:0;">거절</button>
            <button class="save-btn biz-delete-btn" type="button" style="background:transparent;color:var(--text-dim);border:1.5px solid var(--border);margin-left:0;">삭제</button>
          </div>
        </div>
      `;
    }).join('');

    orderList.querySelectorAll('.biz-approve-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ updateBusinessStatus(btn.closest('.order-card').dataset.id, 'approved'); });
    });
    orderList.querySelectorAll('.biz-delete-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteBusinessApplication(btn.closest('.order-card').dataset.id); });
    });
    orderList.querySelectorAll('.biz-reject-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ updateBusinessStatus(btn.closest('.order-card').dataset.id, 'rejected'); });
    });
  }

  async function deleteBusinessApplication(id){
    const app = allBusinessApps.find(b => b.id === id);
    const name = app ? app.business_name : '이 업체';

    let confirmMsg;
    if(app && app.status === 'approved'){
      confirmMsg = `⚠️ "${name}"은(는) 현재 승인되어 이용 중인 업체예요.\n\n삭제하면 로그인 정보가 완전히 사라져서 더 이상 로그인도, 업체 단가 적용도 안 돼요.\n\n단순히 이용을 중단시키고 싶으면 삭제 대신 "거절" 버튼을 눌러주세요.\n\n그래도 정말 삭제하시겠어요?`;
    } else {
      confirmMsg = `"${name}" 가입 신청을 목록에서 삭제할까요?\n\n(참고: 첨부된 사진 파일은 Storage에 그대로 남아있어요)`;
    }

    if(!confirm(confirmMsg)) return;
    try{
      const { error } = await supabaseClient.rpc('admin_delete_business_application', {
        p_password: adminPassword, p_id: id,
      });
      if(error) throw error;
      allBusinessApps = allBusinessApps.filter(b => b.id !== id);
      renderBusinessApps();
      updateTabBadges();
    } catch(err){
      alert('삭제 중 문제가 발생했어요.');
    }
  }

  async function updateBusinessStatus(id, status){
    try{
      const { error } = await supabaseClient.rpc('admin_update_business_application', {
        p_password: adminPassword, p_id: id, p_status: status,
      });
      if(error) throw error;
      const app = allBusinessApps.find(b => b.id === id);
      if(app) app.status = status;
      renderBusinessApps();
      updateTabBadges();
      if(status === 'approved' && app){
        showNotifyPopup(app);
      }
    } catch(err){
      alert('처리 중 문제가 발생했어요.');
    }
  }

  function showNotifyPopup(app){
    const message = `안녕하세요, 비움박스입니다!\n${app.business_name} 업체 가입이 승인되어, 이제 비움박스를 업체 전용 단가로 이용하실 수 있어요.\n\n신청하기 페이지에서 등록하신 연락처와 비밀번호로 로그인하시면 자동으로 업체가가 적용돼요.\n\n또는 카카오톡 채널로 등록하시거나 전화(010-6548-8753) 주셔도 주문·수거 요청 가능해요. 편하신 방법으로 이용해주세요.\n\n감사합니다!`;
    document.getElementById('notifyTitle').textContent = `${app.business_name} 승인 완료!`;
    document.getElementById('notifyMessage').value = message;
    document.getElementById('notifyCallLink').href = 'tel:' + (app.phone || '').replace(/[^0-9]/g, '');
    document.getElementById('notifyOverlay').classList.add('open');
  }

  document.getElementById('notifyCopyBtn').addEventListener('click', function(){
    const textarea = document.getElementById('notifyMessage');
    textarea.select();
    try{
      document.execCommand('copy');
      this.textContent = '복사됐어요 ✓';
      setTimeout(() => { this.textContent = '문구 복사하기'; }, 1500);
    } catch(e){
      navigator.clipboard.writeText(textarea.value);
    }
  });

  document.getElementById('notifyCloseBtn').addEventListener('click', function(){
    document.getElementById('notifyOverlay').classList.remove('open');
  });

  async function deleteOrder(id){
    const order = allOrders.find(o => o.id === id);
    const label = order ? (TYPE_LABEL[order.request_type] || order.request_type) : '이';
    if(!confirm(`이 ${label} 건을 목록에서 완전히 삭제할까요?`)) return;
    try{
      const { error } = await supabaseClient.rpc('admin_delete_request', {
        p_password: adminPassword, p_id: id,
      });
      if(error) throw error;
      allOrders = allOrders.filter(o => o.id !== id);
      renderOrders();
      updateTabBadges();
    } catch(err){
      alert('삭제 중 문제가 발생했어요.');
    }
  }

  function renderOrders(){
    const filtered = currentFilter === 'all'
      ? allOrders
      : allOrders.filter(o => o.request_type === currentFilter);

    if(filtered.length === 0){
      orderList.innerHTML = '<div class="empty-state">해당하는 주문이 없어요.</div>';
      return;
    }

    orderList.innerHTML = filtered.map(function(o){
      const statusOpts = STATUS_OPTIONS[o.request_type] || STATUS_OPTIONS.apply;
      const optionsHtml = statusOpts.map(function(opt){
        return `<option value="${opt[0]}" ${o.status === opt[0] ? 'selected' : ''}>${opt[1]}</option>`;
      }).join('');

      let detailLines = [];
      detailLines.push(`<b>현장 주소</b> ${o.site_address || '-'}`);
      if(o.customer_type) detailLines.push(`<b>유형</b> ${o.customer_type === 'business' ? '업체' : '개인'}`);
      if(o.box_quantity) detailLines.push(`<b>박스 수량</b> ${o.box_quantity}개`);
      if(o.desired_date) detailLines.push(`<b>희망일</b> ${o.desired_date}`);
      if(o.payment_method) detailLines.push(`<b>결제수단</b> ${o.payment_method}`);
      if(o.memo) detailLines.push(`<b>메모</b> ${o.memo}`);

      const RECEIPT_LABEL = { tax_invoice: '세금계산서', cash_receipt: '현금영수증' };
      const receiptHtml = (o.receipt_type && o.receipt_type !== 'none') ? `
        <div class="receipt-notice ${o.receipt_status === 'issued' ? 'issued' : ''}">
          <span class="receipt-notice-text">🧾 <b>${RECEIPT_LABEL[o.receipt_type] || o.receipt_type} 요청</b> · ${o.receipt_info || '-'}${o.receipt_doc_url ? ` · <a href="${o.receipt_doc_url}" target="_blank" style="color:var(--ink);text-decoration:underline;font-weight:700;">첨부사진 보기</a>` : ''}</span>
          ${o.receipt_status === 'issued'
            ? '<span class="receipt-issued-tag">발행완료 ✓</span>'
            : `<button class="receipt-issue-btn" type="button" data-receipt-id="${o.id}">발행완료 처리</button>`}
        </div>
      ` : '';

      return `
        <div class="order-card" data-id="${o.id}">
          <div class="order-top">
            <div>
              <span class="type-badge ${o.request_type}">${TYPE_LABEL[o.request_type] || o.request_type}</span>
            </div>
            <span class="order-time">${formatDate(o.created_at)}</span>
          </div>
          <div class="order-name">${o.name || '이름 없음'} · ${o.phone || '-'}</div>
          <div class="order-detail">${detailLines.join('<br>')}</div>
          ${receiptHtml}
          <div class="order-controls">
            <select class="status-select">${optionsHtml}</select>
            <label class="pay-check">
              <input type="checkbox" class="pay-checkbox" ${o.payment_confirmed ? 'checked' : ''}>
              결제 확인됨
            </label>
            <button class="save-btn" type="button">저장</button>
            <button class="delete-req-btn" type="button" data-delete-id="${o.id}">삭제</button>
          </div>
        </div>
      `;
    }).join('');

    orderList.querySelectorAll('.receipt-issue-btn').forEach(function(btn){
      btn.addEventListener('click', async function(){
        const id = btn.dataset.receiptId;
        btn.disabled = true;
        btn.textContent = '처리 중...';
        try{
          const { error } = await supabaseClient.rpc('admin_update_receipt_status', {
            p_password: adminPassword, p_id: id, p_receipt_status: 'issued',
          });
          if(error) throw error;
          const order = allOrders.find(o => o.id === id);
          if(order) order.receipt_status = 'issued';
          renderOrders();
        } catch(err){
          alert('처리 중 문제가 발생했어요.');
          btn.disabled = false;
          btn.textContent = '발행완료 처리';
        }
      });
    });

    orderList.querySelectorAll('.delete-req-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteOrder(btn.dataset.deleteId); });
    });

    orderList.querySelectorAll('.order-card').forEach(function(card){
      const id = card.dataset.id;
      const saveBtn = card.querySelector('.save-btn');
      saveBtn.addEventListener('click', async function(){
        const status = card.querySelector('.status-select').value;
        const paymentConfirmed = card.querySelector('.pay-checkbox').checked;
        saveBtn.textContent = '저장 중...';
        try{
          const { error } = await supabaseClient.rpc('admin_update_request', {
            p_password: adminPassword,
            p_id: id,
            p_status: status,
            p_payment_confirmed: paymentConfirmed,
          });
          if(error) throw error;
          saveBtn.textContent = '저장됨 ✓';
          saveBtn.classList.add('saved');
          setTimeout(function(){
            saveBtn.textContent = '저장';
            saveBtn.classList.remove('saved');
          }, 1500);
          const order = allOrders.find(o => o.id === id);
          if(order){ order.status = status; order.payment_confirmed = paymentConfirmed; }
          updateTabBadges();
        } catch(err){
          alert('저장 중 문제가 발생했어요.');
          saveBtn.textContent = '저장';
        }
      });
    });
  }
</script>

</body>
</html>
